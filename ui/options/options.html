<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes de Link Previewer</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="settings-container">
    <div class="header">
      <h1>Ajustes de Link Previewer</h1>
      <span id="app-version" class="version-badge">v0.0.0</span>
    </div>

    <form id="settings-form">
      <div class="form-group">
        <label for="activationKey">Tecla activadora</label>
        <select id="activationKey" name="activationKey">
          <option value="Shift">Shift</option>
          <option value="Control">Control (Ctrl)</option>
          <option value="Alt">Alt</option>
          <option value="none">Ninguna (Hover directo)</option>
        </select>
        <small>Mantén pulsada esta tecla al pasar el ratón sobre un enlace para abrir la vista previa.</small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="previewWidth">Ancho por defecto (px)</label>
          <input type="number" id="previewWidth" name="previewWidth" min="200" max="1920" step="10">
        </div>

        <div class="form-group">
          <label for="previewHeight">Alto por defecto (px)</label>
          <input type="number" id="previewHeight" name="previewHeight" min="150" max="1080" step="10">
        </div>
      </div>

      <div class="form-group">
        <label for="previewDelay">Retardo de activación (ms)</label>
        <input type="number" id="previewDelay" name="previewDelay" min="0" max="2000" step="50">
        <small>Tiempo que debe permanecer el cursor sobre el enlace antes de mostrar la previsualización.</small>
      </div>

      <div class="form-group">
        <label for="blacklistedDomains">Lista negra de dominios</label>
        <textarea id="blacklistedDomains" name="blacklistedDomains" rows="4" placeholder="ejemplo.com&#10;otrodominio.es"></textarea>
        <small>Escribe un dominio por línea. La vista previa estará deshabilitada en estos sitios.</small>
      </div>

      <div class="actions">
        <button type="submit" id="save-btn" class="btn-primary">Guardar cambios</button>
        <span id="status-message" class="status-message"></span>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
